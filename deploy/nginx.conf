# copied to /etc/nginx/sites-available/node-lightsail-api by setup.sh

# 10 req/s per IP, bursts of 20
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

upstream node_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 1m;

    access_log /var/log/nginx/node-lightsail-api.access.log;
    error_log  /var/log/nginx/node-lightsail-api.error.log;

    location / {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://node_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
